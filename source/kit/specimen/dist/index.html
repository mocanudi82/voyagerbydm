<style>/* DM kit · style v1 — shared by all personal apps (Training Suite look). EDF apps use their own identity. */

:root{--ink:#173a3c;--mut:#5b7c7e;--line:#d4e6e6;--chip:#dcefef;--card:#ffffffb8;--tab:#ffffffb8;--g1:#d8f0ef;--g2:#f4f8f6;--g3:#fdf1e4;--acc:#2b8f91;--acc-l:#4fbbbc;--acc2:#f39120;--acc2-l:#f6b25a;--acc3:#f2b705;--red:#ec4624;--sh:#2b8f9126;--soft:#dcefef;--ok:#2e7d32;--bad:#c62828;--info:#1d6fb8;--bg:#eaf4f4;--r:22px;--fh:"Oswald","Arial Narrow",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e8f1ee;--mut:#9fc0bd;--line:#3a5a59;--chip:#2f4b4a;--card:#24403fcc;--tab:#2f4b4acc;--g1:#10302f;--g2:#172625;--g3:#2a2420;--acc:#7fd6cf;--acc-l:#4fbbbc;--sh:#00000040;--soft:#2f4b4a;--ok:#7fd6a0;--bad:#ff8f7a;--info:#7db8ee;--bg:#172625;color-scheme:dark}}
:root[data-theme=dark]{--ink:#e8f1ee;--mut:#9fc0bd;--line:#3a5a59;--chip:#2f4b4a;--card:#24403fcc;--tab:#2f4b4acc;--g1:#10302f;--g2:#172625;--g3:#2a2420;--acc:#7fd6cf;--acc-l:#4fbbbc;--sh:#00000040;--soft:#2f4b4a;--ok:#7fd6a0;--bad:#ff8f7a;--info:#7db8ee;--bg:#172625;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{font:500 16px/1.4 var(--fh);color:var(--ink);background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 38%,var(--g3) 100%) fixed;padding-bottom:calc(98px + env(safe-area-inset-bottom));letter-spacing:.2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g1);z-index:40}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--acc);text-decoration:none}
#app{max-width:640px;margin:0 auto}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 16px 10px;display:flex;align-items:flex-end;gap:10px;background:color-mix(in srgb,var(--g1) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#hdr h1{margin:0;flex:1;min-width:0;display:flex;align-items:flex-end;gap:6px;font:700 24px/1.5 var(--fh);text-transform:uppercase;letter-spacing:.5px;color:var(--ink);text-shadow:2px 2px 0 #4fbbbc,3.5px 3.5px 0 #f39120;white-space:nowrap;overflow:hidden;padding:0 8px 6px 0}
#hdr h1.disco{font-size:38px;line-height:.95;letter-spacing:1px;text-shadow:2px 2px 0 #4fbbbc,4px 4px 0 #f39120,6px 6px 0 #ec4624,8px 8px 0 #222a2a;padding:2px 12px 14px 0;align-items:flex-end;gap:2px}
#hdr h1 .by{font-family:"CavDM",cursive;font-weight:700;font-size:25px;text-transform:none;letter-spacing:0;text-shadow:none;transform:rotate(-3deg);line-height:1;margin:0 0 3px 2px;display:inline-block}
#hdr .hb{background:var(--tab);border:1px solid #ffffff55;color:var(--ink);border-radius:50%;min-width:40px;height:40px;font-size:18px;position:relative;box-shadow:0 4px 12px var(--sh);flex:none}
#hdr .cnt{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
main{padding:12px 16px 20px}
.card{background:var(--card);border:1px solid #ffffff55;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 24px var(--sh);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h3{margin:0 0 8px;font:700 17px/1.2 var(--fh);text-transform:uppercase;letter-spacing:.9px}
.stitle{font:700 22px/1.3 var(--fh);text-transform:uppercase;letter-spacing:.5px;text-shadow:1.5px 1.5px 0 #4fbbbc,3px 3px 0 #f39120;margin:2px 0 6px}
.row{display:flex;gap:8px;align-items:center}
.row.w{flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut);font-size:14px}
.sm{font-size:13px}
.big{font:700 34px/1.05 var(--fh)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:linear-gradient(90deg,#2b8f91,#4fbbbc);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;text-transform:uppercase;font-size:14px;letter-spacing:1px;box-shadow:0 6px 14px #2b8f9140}
.btn.o{background:var(--card);color:var(--ink);border:2px solid #4fbbbc;box-shadow:none;padding:7px 16px}
.btn.d{background:linear-gradient(90deg,#c0381f,#ec4624);box-shadow:0 6px 14px #ec462440}
.btn.c{background:linear-gradient(90deg,#f39120,#f6b25a);color:#173a3c;box-shadow:0 6px 14px #f3912040}
.btn.s{padding:6px 14px;font-size:12px}
.btn.o.s{padding:4px 12px}
.btn.b{width:100%;justify-content:center}
.pill{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:700;background:var(--chip);color:var(--acc);text-transform:uppercase;letter-spacing:.8px}
.pill.red{background:#f8d5ca;color:#b8381f}
.pill.amber{background:#f8e7a8;color:#7a5a00}
.pill.green{background:#d9e6e1;color:#2e6a4f}
.pill.blue{background:#d6e6f5;color:#1d5f9e}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:16px;background:var(--tab);padding:8px 16px;font-size:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.8px;border:0;font-weight:500}
.chip.on{background:linear-gradient(90deg,#2b8f91,#4fbbbc);color:#fff;font-weight:700}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--g2);border-top:4px solid #4fbbbc;border-radius:26px 26px 0 0;display:flex;padding:6px 10px calc(8px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 -10px 30px var(--sh)}
#nav button{flex:1;background:none;border:0;padding:4px 0;font:500 11px var(--fh);text-transform:uppercase;letter-spacing:1px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:16px}
#nav button span{font-size:21px;filter:grayscale(.8)}
#nav button.on{color:var(--ink);font-weight:700;background:var(--chip)}
#nav button.on span{filter:none}
label.f{display:block;margin:0 0 10px}
label.f>b{display:block;font-weight:500;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px}
input[type=checkbox]{width:auto}
input[type=range]{padding:0}
textarea{min-height:80px}
input::placeholder,textarea::placeholder{color:#7aa6a8}
#sheetbg{position:fixed;inset:0;background:rgba(10,40,40,.4);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheetbg.on{display:flex}
#sheet{background:var(--g2);width:100%;max-width:640px;border-top:4px solid #4fbbbc;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -10px 30px var(--sh)}
#sheet h2{margin:0 0 12px;font:700 21px/1.2 var(--fh);text-transform:uppercase;letter-spacing:.8px;text-shadow:1.5px 1.5px 0 #4fbbbc,3px 3px 0 #f39120;padding-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:linear-gradient(90deg,#f39120,#f6c06a);color:#173a3c;font-weight:700;padding:10px 18px;border-radius:999px;z-index:60;display:none;max-width:88%;font-size:14px;box-shadow:0 8px 20px #0003}
.tl-day{margin:16px 4px 6px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1.4px}
.item{display:flex;gap:12px;padding:12px 14px;background:var(--card);border:1px solid #ffffff55;border-radius:20px;margin-bottom:8px;box-shadow:0 6px 18px var(--sh);position:relative;overflow:hidden}
.item::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 6px 6px 0;background:#2b8f91}
.item .ic{font-size:24px;width:30px;text-align:center}
.item .t{font:700 17px/1.25 var(--fh);letter-spacing:.3px}
.item.hotel::before{background:#f39120}
.item.activity::before,.item.restaurant::before{background:#ec4624}
.item.rail::before,.item.car::before{background:#4fbbbc}
.item.note::before{background:var(--mut)}
details.acc{margin-bottom:10px}
details.acc>summary{list-style:none;padding:9px 14px;font:700 16px var(--fh);text-transform:uppercase;letter-spacing:1px;cursor:pointer;display:flex;gap:8px;align-items:center;background:linear-gradient(90deg,#2b8f91,#4fbbbc);color:#fff;border-radius:999px;box-shadow:0 6px 14px #2b8f9140}
details.acc.alt>summary{background:linear-gradient(90deg,#f39120,#f6b25a);color:#173a3c;box-shadow:0 6px 14px #f3912040}
details.acc>summary .mut{color:inherit;opacity:.85}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'▾';margin-left:auto;font-size:14px}
details.acc[open]>summary::after{content:'▴'}
details.acc>div{padding:12px 4px 4px}
.stat{background:var(--card);border:1px solid #ffffff55;border-radius:20px;padding:14px;text-align:center;box-shadow:0 6px 18px var(--sh)}
.stat b{display:block;font:700 30px var(--fh);color:var(--ink);text-shadow:1.5px 1.5px 0 #4fbbbc,3px 3px 0 #f39120;margin-bottom:4px}
.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4fbbbc,#f39120)}
.hero{background:linear-gradient(135deg,#2b8f91,#4fbbbc 62%,#f39120);color:#fff;border-radius:26px;padding:18px;margin-bottom:12px;box-shadow:0 12px 28px #2b8f9140;border:1px solid #ffffff66}
.hero .big{color:#fff;text-shadow:2px 2px 0 #173a3c55}
.hero .mut{color:#ffffffe6}
.hero .btn{background:#fff;color:#173a3c;box-shadow:none}
.hero .btn.o{background:#ffffff2e;color:#fff;border-color:#fff}
.star{color:var(--acc3);font-size:22px;cursor:pointer}
.star.off{color:var(--line)}
.tag{font-size:12px;background:var(--chip);border-radius:999px;padding:1px 9px;margin-right:4px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv b{font-weight:500;color:var(--mut);text-transform:uppercase;font-size:12px;letter-spacing:.9px}
.kv span{text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#hdr{align-items:flex-start}
#hdr .tt{flex:1;min-width:0}
#hdr .hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
#hdr h1.disco{display:flex;align-items:flex-end;gap:2px;margin:0;font:700 38px/.95 var(--fh);text-transform:uppercase;letter-spacing:1px;text-shadow:2px 2px 0 #4fbbbc,4px 4px 0 #f39120,6px 6px 0 #ec4624,8px 8px 0 #222a2a;padding:2px 12px 12px 0;white-space:nowrap;overflow:hidden;color:var(--ink)}
#hdr h1.disco.s{font-size:32px}
#hdr h1.disco.xs{font-size:25px}
#hdr .sub{font:500 15px/1.2 var(--fh);letter-spacing:2.2px;text-transform:uppercase;color:var(--mut);margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .dt{font:500 14px var(--fh);letter-spacing:1.4px;color:var(--mut);white-space:nowrap}
#hdr h1.disco.s,#hdr h1.disco.xs{white-space:normal;overflow:visible;line-height:1.02;padding-bottom:10px}
#hdr h1.disco.xs{font-size:26px}
#hdr .hb.bk{background:none;backdrop-filter:none;border:0;box-shadow:none;font:700 56px/.7 var(--fh);color:var(--ink);min-width:30px;height:auto;padding:0 6px 6px 0;text-shadow:2px 2px 0 #4fbbbc,4px 4px 0 #f39120,6px 6px 0 #ec4624;align-self:center}
h3{text-decoration:underline;text-decoration-color:#4fbbbc;text-decoration-thickness:4px;text-underline-offset:7px}
h3::before{content:"★";color:#ec4624;margin-right:8px;font-size:.85em}
.lab{font:500 18px var(--fh);letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.acc summary .dtt{font:700 20px var(--fh);letter-spacing:.5px;text-shadow:1.5px 1.5px 0 #4fbbbc,3px 3px 0 #f39120}
.seg{display:inline-flex;border-radius:999px;background:var(--soft);padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 18px;font:500 15px var(--fh);letter-spacing:.8px;text-transform:uppercase;color:var(--ink)}
.seg button.on{background:linear-gradient(90deg,#2b8f91,#4fbbbc);color:#fff;box-shadow:0 4px 10px #2b8f9140}
</style>
<style>.sw{display:flex;gap:8px;flex-wrap:wrap}.sw i{display:block;width:54px;height:54px;border-radius:16px;border:1px solid #fff6;box-shadow:0 4px 10px var(--sh)}.sw span{display:block;font-size:11px;text-align:center;margin-top:3px;color:var(--mut);letter-spacing:.5px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:10px}.app{border-radius:20px;padding:14px;background:var(--card);border:1px solid #ffffff55;box-shadow:0 6px 18px var(--sh)}.app b{display:block;font:700 20px var(--fh);text-transform:uppercase;text-shadow:1.5px 1.5px 0 #4fbbbc,3px 3px 0 #f39120}
.edf{background:#fff;border:2px dashed #7a8a99;color:#33495c}.edf b{text-shadow:none;color:#1e4e79}
</style>
</head>
<body>
<div id="app"><div id="hdr"></div><main id="view"></main></div>
<nav id="nav"></nav>
<div id="sheetbg"><div id="sheet"></div></div>
<div id="toast"></div>
<script>
/* DM kit · core v1 — helpers shared by all personal apps */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
/* toast + sheet */
let _tt;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>e.style.display='none',2800)}
let sheetCb=null;
function openSheet(title,html,cb,o={}){sheetCb=cb;$('#sheet').innerHTML=`<h2>${title}</h2>${html}${cb?`<div class="row" style="margin-top:8px"><button class="btn o sp" data-act="closeSheet">${o.cancel||'Cancel'}</button><button class="btn sp" data-act="sheetOk">${o.ok||'Save'}</button></div>`:`<button class="btn o b" data-act="closeSheet">${o.close||'Close'}</button>`}`;$('#sheetbg').classList.add('on')}
function closeSheet(){$('#sheetbg').classList.remove('on');sheetCb=null}
function vals(){const v={};$$('#sheet [data-f]').forEach(e=>{v[e.dataset.f]=e.type==='checkbox'?e.checked:e.value});return v}
function F(id,label,val,o={}){val=val??'';const t=o.type||'text';
 if(t==='select')return`<label class="f"><b>${label}</b><select data-f="${id}">${o.opts.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}" ${v==val?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`;
 if(t==='area')return`<label class="f"><b>${label}</b><textarea data-f="${id}" placeholder="${esc(o.ph||'')}" rows="${o.rows||3}">${esc(val)}</textarea></label>`;
 if(t==='check')return`<label class="f row"><input type="checkbox" data-f="${id}" ${val?'checked':''}><span>${label}</span></label>`;
 return`<label class="f"><b>${label}</b><input data-f="${id}" type="${t}" value="${esc(val)}" placeholder="${esc(o.ph||'')}" ${o.list?`list="${o.list}"`:''} ${o.step?`step="${o.step}"`:''} ${o.up?'style="text-transform:uppercase"':''}></label>`}
function confirmSheet(text,fn,o={}){openSheet(o.title||'Please confirm',`<div style="margin-bottom:12px">${esc(text)}</div>`,()=>{fn()},{ok:o.ok||'Confirm'})}
/* components (return HTML) */
const dmPill=(cls,t)=>`<span class="pill ${cls||''}">${t}</span>`;
const dmStat=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
const dmBar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
const dmSeg=(items,cur,act)=>`<div class="seg">${items.map(([k,l])=>`<button class="${k===cur?'on':''}" data-act="${act}" data-k="${k}">${l}</button>`).join('')}</div>`;
const dmChips=(items,cur,act)=>`<div class="chips">${items.map(([k,l])=>`<div class="chip ${k===cur?'on':''}" data-act="${act}" data-k="${k}">${l}</div>`).join('')}</div>`;
const dmAcc=(title,inner,open,alt)=>`<details class="acc ${alt?'alt':''}" ${open?'open':''}><summary>${title}</summary><div>${inner}</div></details>`;
function dmHeader({title,sub='',back=false,by=false,date=true,badge=0,big=false}){const n=new Date(),L=document.documentElement.lang||'en-GB';const dt=n.toLocaleDateString(L,{weekday:'short'}).toUpperCase()+', '+n.getDate()+' '+n.toLocaleDateString(L,{month:'short'}).toUpperCase();const sz=big?'':(String(title).length>16?' xs':' s');
 return`${back?'<button class="hb bk" data-act="back">‹</button>':''}<div class="tt"><h1 class="disco${sz}">${esc(title)}${by?'<span class="by">by DM</span>':''}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div><div class="hr"><button class="hb" data-act="alerts">🔔${badge?`<span class="cnt">${badge}</span>`:''}</button>${date?`<div class="dt">${dt}</div>`:''}</div>`}
function dmNav(tabs,cur){return tabs.map(([k,ic,l])=>`<button class="${k===cur?'on':''}" data-act="tab" data-t="${k}"><span>${ic}</span>${l}</button>`).join('')}
/* files */
const blobToDataUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const dataUrlToBlob=u=>fetch(u).then(r=>r.blob());
function dl(name,text,type){const b=new Blob([text],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Copy not available')}ta.remove()}}
/* IndexedDB: dmDB('app-name',['docs','wallet']) -> {put,get,del,all}(store,...) */
function dmDB(name,stores,ver=1){let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open(name,ver);r.onupgradeneeded=()=>stores.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const op=async(s,m,f)=>{const d=await open();return new Promise((res,rej)=>{const tx=d.transaction(s,m),r=f(tx.objectStore(s));tx.oncomplete=()=>res(r.result);tx.onerror=()=>rej(tx.error)})};
 return{put:(s,d)=>op(s,'readwrite',x=>x.put(d)),get:(s,id)=>op(s,'readonly',x=>x.get(id)),del:(s,id)=>op(s,'readwrite',x=>x.delete(id)),all:s=>op(s,'readonly',x=>x.getAll())}}
/* crypto: password-encrypted sections in backups (AES-GCM, PBKDF2) + passcode hash */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function aesKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encText(text,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(pw,salt),new TextEncoder().encode(text)));return{alg:'AES-GCM/PBKDF2-SHA256',s:b64(salt),i:b64(iv),c:b64(ct)}}
async function decText(o,pw){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},await aesKey(pw,unb64(o.s)),unb64(o.c)))}
async function hashPin(p,salt='dm'){const d=new TextEncoder().encode(salt+':'+p);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}let x=5381;for(const c of d)x=((x<<5)+x+c)>>>0;return'f'+x}
/* theme: 'auto' | 'light' | 'dark' */
function dmTheme(t){if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
/* language: text-node dictionary swap, no per-string markup needed */
function dmI18n(dict,active){if(!active)return;const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;const b=[];while(n=w.nextNode())b.push(n);b.forEach(x=>{const k=x.nodeValue.trim();if(k&&dict[k]!==undefined)x.nodeValue=x.nodeValue.replace(k,dict[k])})}
/* backup envelope shared by all apps: {app,v,at,data,files?,vault?} */
function dmEnvelope(app,data,extra={}){return JSON.stringify({app,v:1,at:new Date().toISOString(),data,...extra})}
function dmOpenEnvelope(txt,app){const o=JSON.parse(txt);if(o.app!==app)throw new Error('Not a '+app+' backup');return o}
/* PWA */
function dmPWA(){if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
/* shared event wiring: data-act buttons -> ACT table; sheet ok/close built in */
function dmWire(ACT){document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT')return;const a=t.dataset.act;if(a==='closeSheet')return closeSheet();if(a==='sheetOk'){const cb=sheetCb;if(cb){Promise.resolve(cb(vals())).then(r=>{if(r!==false)closeSheet()})}return}if(ACT[a])ACT[a](t.dataset,t)});$('#sheetbg').addEventListener('click',e=>{if(e.target.id==='sheetbg')closeSheet()})}

const S={tab:'style',theme:'auto',seg:'a'};
const sw=(c,n)=>`<div><i style="background:${c}"></i><span>${n}</span></div>`;
function render(){
 $('#hdr').innerHTML=dmHeader({title:'DM kit',sub:'Style · Components · Build',by:false,big:true}).replace('class="disco"','class="disco"');
 $('#nav').innerHTML=dmNav([['style','🎨','Style'],['comp','🧩','Parts'],['apps','📱','Apps']],S.tab);
 $('#view').innerHTML=S.tab==='style'?vStyle():S.tab==='comp'?vComp():vApps()}
const vStyle=()=>`
<div class="card"><div class="lab">Theme</div>${dmSeg([['auto','Auto'],['light','Light'],['dark','Dark']],S.theme,'theme')}</div>
<div class="card"><h3>Titles</h3><h1 class="disco" style="display:block;font:700 38px/1 var(--fh);text-transform:uppercase;letter-spacing:1px;text-shadow:2px 2px 0 #4fbbbc,4px 4px 0 #f39120,6px 6px 0 #ec4624,8px 8px 0 #222a2a;padding:2px 12px 14px 0;margin:0">Voyager<span style="font:700 25px CavDM;text-transform:none;text-shadow:none;margin-left:6px;display:inline-block;transform:rotate(-3deg)">by DM</span></h1><div class="stitle" style="margin-top:12px">Day title · Thu 24 Dec</div><div class="lab" style="margin:8px 0 0">Today · Thursday 19 November</div></div>
<div class="card"><h3>Colours</h3><div class="sw">${sw('#2b8f91','Teal')}${sw('#4fbbbc','Light teal')}${sw('#f39120','Orange')}${sw('#ec4624','Red')}${sw('#222a2a','Dark')}${sw('#173a3c','Ink')}</div><div class="mut sm" style="margin:10px 0 4px">Background</div><div style="height:46px;border-radius:16px;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));border:1px solid var(--line)"></div></div>
<div class="card"><h3>Font</h3><div style="font:700 30px var(--fh)">Oswald 700</div><div style="font:500 22px var(--fh)">Oswald 500 · 0123456789 €</div><div style="font:700 28px CavDM">handwritten · by DM</div></div>`;
const vComp=()=>`
<div class="card"><h3>Buttons</h3><div class="row w"><button class="btn">Primary</button><button class="btn o">Outline</button><button class="btn c">Amber</button><button class="btn d">Danger</button><button class="btn s">Small</button></div></div>
<div class="card"><h3>Switch and chips</h3>${dmSeg([['a','Trips'],['b','Calendar']],S.seg,'seg')}<div style="height:10px"></div>${dmChips([['1','Plan'],['2','People'],['3','Money'],['4','Pack']],'1','x')}</div>
<div class="card"><h3>Status</h3><div class="row w">${dmPill('green','Good')}${dmPill('amber','Watch')}${dmPill('red','Urgent')}${dmPill('blue','Info')}${dmPill('','Neutral')}</div><div style="height:12px"></div>${dmBar(62)}</div>
<div class="g2">${dmStat('8','Trip days')}${dmStat('3','Flights')}</div>
<div style="height:12px"></div>
${dmAcc('<span class="dtt">Thu 24 Dec</span> · Day 1','<div class="item"><div class="ic">✈️</div><div><div class="t">AF178 CDG → MEX</div><div class="mut sm">11:15 → 16:30</div></div></div>',true)}${dmAcc('<span class="dtt">Fri 25 Dec</span>','Day content',false,true)}
<div class="hero"><div class="mut">NEXT FLIGHT</div><div class="big">AF178 CDG → MEX</div><div class="row w" style="margin-top:10px"><button class="btn">Open</button><button class="btn o">Maps</button></div></div>
<div class="card"><h3>Form and list</h3><label class="f"><b>Name</b><input value="Dani"></label><div class="kv"><b>Seat</b><span>12A</span></div><div class="kv"><b>Gate</b><span>K42</span></div><div class="row w" style="margin-top:10px"><button class="btn o" data-act="sheet">Open sheet</button><button class="btn o" data-act="toast">Toast</button></div></div>`;
const vApps=()=>`<div class="card"><h3>The family</h3><div class="apps"><div class="app"><b>Training</b><div class="mut sm">Master look</div></div><div class="app"><b>Voyager</b><div class="mut sm">Travel</div></div><div class="app"><b>Next app</b><div class="mut sm">Same kit</div></div><div class="app edf"><b>EDF tools</b><div class="sm">Own identity, kept apart</div></div></div></div>
<div class="card"><h3>Build</h3><div class="kv"><b>dm-style.css</b><span>Look</span></div><div class="kv"><b>dm-core.js</b><span>Helpers</span></div><div class="kv"><b>dm-fonts.css</b><span>Fonts</span></div><div class="kv"><b>build.py</b><span>One file out</span></div></div>`;
const ACT={tab(d){S.tab=d.t;render()},theme(d){S.theme=d.k;dmTheme(d.k);render()},seg(d){S.seg=d.k;render()},sheet(){openSheet('Sheet',F('n','Name','Dani')+F('s','Seat','12A',{type:'select',opts:['Aisle','Window']}),()=>toast('Saved'))},toast(){toast('Toast message')},back(){},alerts(){}};
dmWire(ACT);render();

dmPWA();
</script>
</body>
</html>
