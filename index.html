html,body{margin:0;color:var(--ink);font-family:'Oswald','Arial Narrow',sans-serif;font-weight:400;letter-spacing:.2px;min-height:100%}
body{background:linear-gradient(165deg,#86d6cb 0%,#c3e6da 32%,#fbdcc4 72%,#f5b595 100%) fixed;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--acc);text-decoration:none}
#app{max-width:600px;margin:0 auto}
.glass{background:var(--card);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 6px 22px rgba(16,48,58,.08)}
#hdr{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.6)}
#hdr h1{margin:0;font-size:24px;font-weight:500;flex:1;text-transform:uppercase;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
#hdr h1 .by{font-family:'Caveat',cursive;text-transform:none;font-size:20px;letter-spacing:0;color:var(--acc2);margin-left:6px;font-weight:600}
#hdr .hb{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);color:var(--ink);border-radius:50%;min-width:42px;height:42px;font-size:18px;position:relative}
#hdr .cnt{position:absolute;top:-4px;right:-4px;background:var(--acc2);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
main{padding:14px 14px 20px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 6px 22px rgba(16,48,58,.08);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:17px;font-weight:500;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:8px;align-items:center}.row.w{flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:14px}.sm{font-size:13px}.big{font-size:34px;font-weight:600;line-height:1.05}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);background:linear-gradient(135deg,#0e7c86,#35a99f);color:#fff;border-radius:999px;padding:9px 18px;font-weight:500;cursor:pointer;text-transform:uppercase;font-size:14px;letter-spacing:.8px;box-shadow:0 4px 12px rgba(14,124,134,.25)}
.btn.o{background:rgba(255,255,255,.55);color:var(--acc);box-shadow:none}.btn.d{background:var(--bad);border-color:var(--bad)}.btn.c{background:linear-gradient(135deg,#e8845a,#f2a173);border-color:var(--acc2)}.btn.s{padding:6px 13px;font-size:12px}.btn.b{width:100%;justify-content:center}
.pill{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12px;background:rgba(14,124,134,.12);color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
.pill.red{background:rgba(198,40,40,.14);color:var(--bad)}.pill.amber{background:rgba(242,177,52,.28);color:#8a5600}.pill.green{background:rgba(46,125,50,.15);color:var(--ok)}.pill.blue{background:rgba(29,111,184,.14);color:var(--info)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.6px;backdrop-filter:blur(10px)}
.chip.on{background:linear-gradient(135deg,#0e7c86,#35a99f);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(14,124,134,.25)}
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:rgba(255,255,255,.62);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.85);border-radius:999px;display:flex;padding:6px 8px;max-width:576px;margin:0 auto;box-shadow:0 10px 30px rgba(16,48,58,.16)}

#sheetbg.on{display:flex}

#sheet h2{margin:0 0 12px;font-size:20px;font-weight:500;text-transform:uppercase;letter-spacing:1.2px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(16,48,58,.92);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;display:none;max-width:88%;font-size:14px}
.tl-day{margin:16px 4px 6px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1.4px}

.item::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 6px 6px 0;background:var(--acc)}
.item .ic{font-size:24px;width:30px;text-align:center}.item .t{font-size:17px;font-weight:500}.item.hotel::before{background:var(--acc3)}.item.activity::before,.item.restaurant::before{background:var(--acc2)}.item.rail::before,.item.car::before{background:#6b4eff}.item.note::before{background:var(--mut)}

details.acc>summary{list-style:none;padding:14px 16px;font-size:16px;text-transform:uppercase;letter-spacing:1px;font-weight:500;cursor:pointer;display:flex;gap:8px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}details.acc>summary::after{content:'▾';margin-left:auto;color:var(--mut)}details.acc[open]>summary::after{content:'▴'}

.stat{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:14px;text-align:center}.stat b{display:block;font-size:28px;font-weight:600;color:var(--acc)}.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.9px}

.empty{text-align:center;color:var(--mut);padding:26px 10px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{width:64px;height:64px;border-radius:16px;object-fit:cover;background:var(--soft);flex:none}
.score{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;flex:none}
</style>
</head>

function viewComp(){const C=UI.comp||(UI.comp={from:'',to:'',eu:'yes',issue:'delay',delayH:3,notice:'lt7',reroute:'no',extra:'unknown'});

 return`<div class="card"><h3>Flight compensation</h3><div class="g2"><label class="f"><b>From</b><input data-comp="from" value="${esc(C.from)}" list="apl" style="text-transform:uppercase"></label><label class="f"><b>To</b><input data-comp="to" value="${esc(C.to)}" list="apl" style="text-transform:uppercase"></label></div>

function compCalc(C){const a=AP[C.from?.toUpperCase()],b=AP[C.to?.toUpperCase()];const lines=[];if(!a||!b)return{ok:false,lines:['Enter two airport codes from the list (e.g. CDG, JFK)']};
 const dist=apDist(a.code,b.code);const dep=EU_PLUS.has(a.cc)||a.cc==='GB',arr=EU_PLUS.has(b.cc)||b.cc==='GB';const eu=C.eu==='yes';lines.push(`Great-circle distance ≈ ${Math.round(dist)} km`);
 const covered=dep||(arr&&eu);if(!covered){lines.push('EU/UK rules cover flights departing the EU/UK, or arriving there on an EU/UK airline');return{ok:false,lines}}
 lines.push(dep?'Departs from an EU/EEA/Swiss/UK airport — rules apply':'Arrives in the EU/UK on an EU/UK airline — rules apply');
 const intraEU=EU_PLUS.has(a.cc)&&EU_PLUS.has(b.cc);let amt=dist<=1500?250:(intraEU||dist<=3500)?400:600;let qual=false;
 if(C.issue==='delay'){const h=+C.delayH;qual=h>=3;lines.push(qual?`Arrival delay of ${h} h is 3 h or more`:'Arrival delay is under 3 hours — no cash compensation (care rights may still apply)');if(qual&&dist>3500&&!intraEU&&h<4){amt=300;lines.push('Long-haul delay under 4 h: compensation is reduced by 50%')}}
 else if(C.issue==='cancel'){if(C.notice==='gt14'){lines.push('Notified more than 14 days before — no compensation');qual=false}else if(C.reroute==='yes'){lines.push('Rebooked close to your original times — compensation is normally excluded');qual=false}else{qual=true;lines.push('Short-notice cancellation without a close rebooking')}}
 else{qual=true;lines.push('Involuntary denied boarding qualifies')}
 if(qual&&C.extra==='yes'){lines.push('Airline cites extraordinary circumstances — claim may be refused, but technical faults and crew shortages usually do not count');}
 if(qual)lines.push('Also ask for meals, refreshments and accommodation if you waited, and keep receipts. Claim limits vary by country (France: 5 years).');
 return{ok:qual,amt:qual?amt:0,lines}}

function circleSheet(c){openSheet(c?'Edit contact':'Add to Inner Circle',F('name','Name',c?.name)+F('method','Send via',c?.method||'WhatsApp',{type:'select',opts:['WhatsApp','SMS','Email']})+F('contact','Phone or email',c?.contact,{ph:'+33…'}),v=>{if(!v.name.trim()||!v.contact.trim()){toast('Name and contact needed');return false}if(c)Object.assign(c,v);else S.circle.push({id:uid(),...v});save();render()})}
function viewMe(){const p=S.profile,st=S.settings;const pm=p.passport?(D(p.passport)-new Date())/(864e5*30.4):null;
 const pf=(k,l,o={})=>`<label class="f"><b>${l}</b><input data-prof="${k}" type="${o.type||'text'}" value="${esc(p[k])}" placeholder="${o.ph||''}"></label>`;
 const sf=(k,l,s)=>`<label class="f"><b>${l}</b><input data-set="${k}" type="number" value="${st[k]}"${s?' step="'+s+'"':''}></label>`;
 return`<div class="card"><h3>Traveller profile</h3>${pf('name','Name')}<div class="g2">${pf('home','Home airport',{ph:'CDG'})}${pf('ktn','Frequent flyer / known traveller no.')}</div><div class="g2"><label class="f"><b>Seat preference</b><select data-prof="seat">${['Aisle','Window','Exit row','No preference'].map(x=>`<option ${p.seat===x?'selected':''}>${x}</option>`).join('')}</select></label>${pf('meal','Meal preference')}</div>${pf('emerg','Emergency contact',{ph:'Name · phone'})}</div>
 <div class="card"><h3>Passport</h3><div class="g2">${pf('passportCountry','Issuing country')}${pf('passport','Expiry date',{type:'date'})}</div>${pm!==null?`<span class="pill ${pm<6?'red':pm<9?'amber':'green'}">${pm<0?'Expired':pm.toFixed(0)+' months left'}</span><div class="mut sm" style="margin-top:6px">Reminder starts 9 months before expiry. Many countries require 6 months' validity on arrival.</div>`:'<div class="mut sm">Add the expiry date to get renewal reminders.</div>'}</div>
 <div class="card"><div class="row"><h3 class="sp" style="margin:0">Inner Circle</h3><button class="btn s" data-act="circleAdd">+ Add</button></div>${S.circle.map(c=>`<div class="row" style="padding:8px 0;border-bottom:1px dashed var(--line)" data-act="circleEdit" data-id="${c.id}"><div class="sp"><div>${esc(c.name)}</div><div class="mut sm">${esc(c.method)} · ${esc(c.contact)}</div></div><button class="btn d s" data-act="circleDel" data-id="${c.id}">✕</button></div>`).join('')||'<div class="empty">No contacts yet</div>'}</div>
 <div class="card"><h3>Settings</h3><div class="g2">${sf('buffer','Airport arrival, international (min)')}${sf('bufferDom','Airport arrival, domestic (min)')}</div><div class="g2">${sf('travelMin','Default travel to airport (min)')}${sf('minConnect','Minimum connection (min)')}</div><div class="g2"><label class="f"><b>Documents per trip</b><select data-set="docLimit">${[3,25].map(n=>`<option ${st.docLimit==n?'selected':''}>${n}</option>`).join('')}</select></label><label class="f"><b>Wikipedia language</b><select data-set="wiki">${['en','fr','es','de','it','pt'].map(n=>`<option ${st.wiki===n?'selected':''}>${n}</option>`).join('')}</select></label></div>
 <div class="row w"><button class="btn o s" data-act="notif">${st.notify?'🔔 Reminders on':'🔕 Enable reminders'}</button></div><div class="mut sm" style="margin-top:6px">In-app reminders (check-in, Go Now, gate) fire while Voyager is open. For reminders when closed, export the trip calendar — it includes alarms.</div></div>
 <div class="card"><h3>Sync & backup</h3><div class="mut sm" style="margin-bottom:8px">Data stays on this device. Move it to another phone or computer with a backup file.</div><div class="row w"><button class="btn s" data-act="exportAll">Export backup</button><label class="btn o s">Import<input type="file" id="impfile" accept=".json,application/json" hidden></label><button class="btn o s" data-act="exportMsg">Copy as text</button><button class="btn o s" data-act="importMsg">Paste backup</button></div><button class="btn d s" style="margin-top:12px" data-act="reset">Erase all data</button></div>`}

const NAV=[['trips','🧳','Trips'],['explore','🧭','Explore'],['go','✈️','Go'],['tools','🧰','Tools'],['me','👤','Me']];
function render(){const keep=window.scrollY;
 const al=computeAlerts().filter(a=>a.lvl==='red'||a.lvl==='amber').length;
 const back=(UI.tab==='trips'&&UI.tripId)||(UI.tab==='tools'&&UI.tool);
 const title=UI.tab==='trips'?(UI.tripId?(trip(UI.tripId)?.name||'Trip'):'Voyager'):UI.tab==='tools'&&UI.tool?(TOOLS.find(t=>t[0]===UI.tool)?.[2]||'Tools'):({explore:'Explore',go:'On the move',tools:'Tools',me:'Me'})[UI.tab];
 $('#hdr').innerHTML=`${back?`<button class="hb" data-act="back">‹</button>`:''}<h1>${esc(title)}${title==='Voyager'?'<span class="by">by DM</span>':''}</h1><button class="hb" data-act="alerts">🔔${al?`<span class="cnt">${al}</span>`:''}</button>`;
 $('#nav').innerHTML=NAV.map(([k,ic,l])=>`<button class="${UI.tab===k?'on':''}" data-act="tab" data-t="${k}"><span>${ic}</span>${l}</button>`).join('');

function go(tab){UI.tab=tab;window.scrollTo(0,0)}
/* ===== ACTIONS ===== */
function confirmSheet(text,fn){openSheet('Please confirm',`<div style="margin-bottom:12px">${esc(text)}</div>`,()=>{fn()},{ok:'Confirm'})}
async function exportAll(withDocs=true){const o={app:'wayfar',v:1,at:new Date().toISOString(),data:S,docs:[]};if(withDocs){try{for(const d of await docAll())o.docs.push({id:d.id,tripId:d.tripId,name:d.name,type:d.type,size:d.size,added:d.added,url:await blobToDataUrl(d.blob)})}catch(e){}}return JSON.stringify(o)}
async function importBackup(txt){const o=JSON.parse(txt);if(o.app!=='wayfar')throw new Error('Not a Voyager backup');S={...defaults(),...o.data};save();for(const d of o.docs||[]){await docPut({id:d.id,tripId:d.tripId,name:d.name,type:d.type,size:d.size,added:d.added,blob:await dataUrlToBlob(d.url)})}UI.tripId=null;render();toast('Backup restored')}
function notifyText(t){return`Hi! Update on my trip "${t.name}":\n\n${tripText(t)}`}
function sendTo(c,text){shareTo({WhatsApp:'wa',SMS:'sms',Email:'mail'}[c.method]||'wa',text,c.contact)}

 sub(d){UI.sub=d.k;render()},
 newTrip(){tripSheet()},editTrip(){tripSheet(trip(UI.tripId))},
 delTrip(){const t=trip(UI.tripId);closeSheet();confirmSheet('Delete "'+t.name+'" and its documents?',async()=>{try{for(const x of await docsOf(t.id))await docDel(x.id)}catch(e){}S.trips=S.trips.filter(x=>x!==t);UI.tripId=null;save();render()})},
 addItem(){itemSheet(UI.tripId,'flight')},
 itemType(d){const v=vals();itemSheet(UI._item.tid,d.k,null,{...v,id:UI._item.id})},

 delItem(d){const t=trip(UI.tripId);closeSheet();t.items=t.items.filter(i=>i.id!==d.id);save();render()},
 importMail(){importSheet()},
 exportIcs(){const t=trip(UI.tripId);dl((t.name||'trip').replace(/\W+/g,'_')+'.ics',tripICS(t),'text/calendar');toast('Calendar file ready — open it to add events & alarms')},
 tripMap(){const t=trip(UI.tripId);const h=t.items.find(i=>i.type==='hotel');UI.ex.q=h?(h.address||h.title)+' '+(t.dest||''):t.dest||'';UI.tab='explore';render();ACT.exGo()},
 exHotel(d){const t=trip(UI.tripId),h=getItem(t.id,d.id);closeSheet();UI.ex.q=(h.address||h.title)+' '+(t.dest||'');UI.ex.cat='near';UI.tab='explore';render();ACT.exGo()},
 async docOpen(d){const x=(await docAll()).find(y=>y.id===d.id);const u=URL.createObjectURL(x.blob);window.open(u,'_blank')||(location.href=u)},
 async docDel(d){await docDel(d.id);loadDocs()},
 async docRen(d){const x=(await docAll()).find(y=>y.id===d.id);openSheet('Rename',F('n','Name',x.name),async v=>{x.name=v.n||x.name;await docPut(x);loadDocs()})},
 nshare(){nativeShare(tripText(trip(UI.tripId)))},shr(d){shareTo(d.k,tripText(trip(UI.tripId)))},copyTrip(){copy(tripText(trip(UI.tripId)))},
 notifyOne(d){sendTo(S.circle.find(c=>c.id===d.id),notifyText(trip(UI.tripId)))},
 notifyAll(){const t=trip(UI.tripId);openSheet('Send update',S.circle.map(c=>`<div class="row" style="padding:6px 0"><span class="sp">${esc(c.name)}</span><button class="btn s" data-act="notifyOne" data-id="${c.id}">Send</button></div>`).join('')+'<div class="mut sm">Each opens its app with the message ready.</div>')},
 shareItem(d){const i=getItem(UI.tripId,d.id);closeSheet();nativeShare(`${TYPES[i.type][0]} ${itemTitle(i)} — ${fdt(i.start)}${i.conf?' · ref '+i.conf:''}`)},
 chk(d,el){trip(UI.tripId).checklist[+d.k][1]=el.checked?1:0;save();render()},
 chkAdd(){openSheet('Checklist item',F('t','Item',''),v=>{if(v.t.trim()){trip(UI.tripId).checklist.push([v.t,0]);save();render()}})},
 tool(d){UI.tab='tools';UI.tool=d.k;closeSheet();window.scrollTo(0,0);render()},
 alerts(){const a=computeAlerts();openSheet('Alerts',a.map(alertRow).join('')||'<div class="empty">All clear</div>')},
 demo(){demo()},closeSheet(){closeSheet()},
 async sheetOk(){const cb=sheetCb;if(!cb)return;const r=await cb(vals());if(r!==false&&sheetCb===cb)closeSheet()},
 /* explore */
 async exGo(){const E=UI.ex;const q=($('#exq')?.value??E.q??'').trim();if(!q)return toast('Enter a place');E.q=q;E.loading=true;E.err='';render();try{Object.assign(E,await geocode(q))}catch(e){E.loading=false;E.err=e.message;render();return}exploreRun()},
 exLoc(){if(!navigator.geolocation)return toast('Location not available');navigator.geolocation.getCurrentPosition(p=>{Object.assign(UI.ex,{lat:p.coords.latitude,lon:p.coords.longitude,label:'My location',q:'My location'});exploreRun()},()=>toast('Location permission denied'),{timeout:10000})},
 exCat(d){UI.ex.cat=d.k;UI.ex.res=[];render();if(['near','gems','hike','transit'].includes(d.k))exploreRun()},
 exSub(d){UI.ex.sub=d.k;exploreRun()},
 exSave(d){const r=UI.ex.res.find(x=>x.id===d.id)||S.gems.find(x=>x.id===d.id);const k=S.gems.findIndex(x=>x.id===d.id);if(k>=0)S.gems.splice(k,1);else{S.gems.push({id:r.id,name:r.name,lat:r.lat,lon:r.lon,kind:r.kind,note:r.extra?.slice(0,140)||'',thumb:r.thumb,url:r.url});toast('Saved')}save();render()},
 safetyAdd(){safetySheet()},safetyDel(d){S.safety=S.safety.filter(x=>x.id!==d.id);save();render()},
 /* go */
 goPick(d,el){UI.goFlight=el.value;render()},apPick(d){UI.apSel=d.k;render()},
 estLoc(d){const i=getItem(UI.tripId||allFlights().find(f=>f.id===d.id)._t.id,d.id);navigator.geolocation?.getCurrentPosition(p=>{const a=AP[i.from];const km=hav(p.coords.latitude,p.coords.longitude,a.lat,a.lon)*1.4;i.travelMin=Math.round(km/(km>40?60:30)*60+10);save();render();toast(`≈ ${i.travelMin} min to ${i.from} (${Math.round(km)} km by road)`)},()=>toast('Location permission denied'),{timeout:10000})},
 seatLog(d){const i=findItem(d.id);openSheet('Seat check',F('seat','Seat available / current',i.seat,{up:1})+F('better','A better seat is available',false,{type:'check'})+F('note','Note','' ),v=>{(i.seatLog=i.seatLog||[]).push({t:isoLocal(new Date()),seat:v.seat,better:v.better,note:v.note});if(v.better)toast('Better seat logged');save();render()})},

 rate(d){closeSheet();rateSheet(d.id)},compFor(d){const i=findItem(d.id);UI.comp={from:i.from,to:i.to,eu:'yes',issue:i.status.state==='Cancelled'?'cancel':'delay',delayH:Math.max(0,((i.status.delay||0)/60)).toFixed(2),notice:'lt7',reroute:'no',extra:'unknown'};UI.tab='tools';UI.tool='comp';render()},
 compGo(){UI.comp.res=compCalc(UI.comp);render()},
 rewAdd(){rewSheet()},rewEdit(d){rewSheet(S.programs.find(p=>p.id===d.id))},rewDel(d){S.programs=S.programs.filter(p=>p.id!==d.id);closeSheet();save();render()},
 circleAdd(){circleSheet()},circleEdit(d,el,e){if(e.target.closest('[data-act=circleDel]'))return;circleSheet(S.circle.find(c=>c.id===d.id))},circleDel(d,el,e){e.stopPropagation();S.circle=S.circle.filter(c=>c.id!==d.id);save();render()},

 reset(){confirmSheet('Erase every trip, setting and document on this device?',async()=>{try{for(const d of await docAll())await docDel(d.id)}catch(e){}S=defaults();save();UI.tripId=null;render()})}

 if(t.dataset.act&&t.tagName==='SELECT'){const f=ACT[t.dataset.act];if(t.dataset.act==='exRad'){UI.ex.rad=+t.value;if(UI.ex.lat!=null)exploreRun();return}if(t.dataset.act==='exHotelSel'){if(t.value)ACT.exHotel({id:t.value},t);return}f&&f(t.dataset,t);return}
 if(t.dataset.act==='chk'){ACT.chk(t.dataset,t);return}
 if(t.dataset.bind){const i=findItem(t.dataset.iid);if(!i)return;const k=t.dataset.bind;let v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':+t.value):t.value;
  if(k.includes('.')){const[a,b]=k.split('.');i[a]=i[a]||{};i[a][b]=v}else i[k]=v;if(k==='gate'||k==='terminal')i.gateAt=isoLocal(new Date());save();if(['gate','terminal','status.state','checkedIn','seat','travelMin','status.delay'].includes(k))render();return}
 if(t.dataset.prof){S.profile[t.dataset.prof]=t.value;save();render();return}
 if(t.dataset.set){const k=t.dataset.set;S.settings[k]=t.type==='number'?+t.value:(k==='docLimit'?+t.value:t.value);save();render();return}
 if(t.dataset.comp){UI.comp[t.dataset.comp]=t.value;if(t.tagName==='SELECT')render();return}
 if(t.dataset.nav){UI.nav[t.dataset.nav]=t.value;render();return}});

function tick(){const now=new Date();let ch=0;allFlights().forEach(f=>{const dep=flightDep(f);if(!dep||dep<now)return;[[f.id+':ci',new Date(dep-864e5),'Check-in is open for '+itemTitle(f)],[f.id+':go',leaveBy(f),'GO NOW — leave for '+f.from+' ('+itemTitle(f)+')'],[f.id+':gate',new Date(dep-108e5),'Check terminal & gate for '+itemTitle(f)]].forEach(([k,t,m])=>{if(t&&now>=t&&now-t<432e5&&!S.fired[k]){S.fired[k]=1;ch=1;toast(m);if(S.settings.notify&&'Notification'in window&&Notification.permission==='granted'){try{new Notification('Voyager',{body:m})}catch(e){}}}})});if(ch){save();render()}}
